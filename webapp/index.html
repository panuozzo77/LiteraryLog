<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mia Lista di Lettura</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <div class="nav-container">
                <a href="/" class="site-title">Cristian Porzio</a>
                <ul class="nav-links">
                    <li><a href="https://panuozzo77.github.io/Portfolio/">Portfolio</a></li>
                    <li><a href="#" class="active">LiteraryLog</a></li>
                    <li><a href="https://panuozzo77.github.io/blog/">Blog</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>LiteraryLog</h1>
                <p>Il mio database personale di letture.</p>
            </div>

            <div class="controls">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="bookshelf">Tutti</button>
                    <button class="tab-btn" data-tab="reading">Leggendo</button>
                    <button class="tab-btn" data-tab="completed">Completati</button>
                    <button class="tab-btn" data-tab="abandoned">Abbandonati</button>
                    <button class="tab-btn" data-tab="not-read">Non Letti</button>
                </div>

                <div class="search-filter">
                    <input type="text" id="searchInput" class="search-box" placeholder="Cerca un libro...">
                    <button id="sortBtn" class="action-btn">Ordina</button>
                </div>
            </div>

            <div class="books-container" id="booksContainer">
                <!-- Books will be loaded here by JavaScript -->
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Gestito da Cristian Porzio. Hostato su GitHub Pages.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>

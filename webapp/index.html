<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mia Lista di Lettura</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header-image"></div>
    
    <div class="container">
        <div class="header-section">
            <h1>📚 La Mia Lista di Lettura</h1>
            <p class="subtitle">Divertiti a sfogliare cosa leggo.</p>
            <!--
            <p class="description">Automazioni del database utilizzate in questo template:</p>
            <ul class="automations">
                <li>Quando un libro è marcato come <strong>Finito</strong> → Viene impostata la <strong>Data fine</strong> alla data odierna.</li>
                <li>Quando un libro è marcato come <strong>Leggendo</strong> → Viene impostata la <strong>Data inizio</strong> alla data odierna.</li>
                <li>Quando un libro è marcato come <strong>Leggendo</strong> → Viene impostata la <strong>Pagina attuale</strong> a 0.</li>
                <li>Quando un nuovo libro viene aggiunto alla lista di lettura → Viene impostato il <strong>Voto</strong> a "Non ancora votato"</li>
            </ul>
            -->
        </div>

        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" data-tab="bookshelf">📚 Tutti i libri</button>
                <button class="tab-btn" data-tab="reading">📖 Leggendo</button>
                <button class="tab-btn" data-tab="completed">✅ Completati</button>
                <button class="tab-btn" data-tab="abandoned">🗑️ Abbandonati</button>
                <button class="tab-btn" data-tab="not-read">🔖 Non Letti</button>
                <!--<button class="tab-btn" data-tab="all"> </button>-->
            </div>
            
            <div class="search-filter">
                <input type="text" id="searchInput" class="search-box" placeholder="Cerca un libro per titolo, autore...">
                <button id="sortBtn" class="sort-btn">⚡ Ordina</button>
                <button id="searchBtn" class="search-btn">🔍</button>
            </div>
        </div>

        <div class="books-container" id="booksContainer">
            <!-- Books will be loaded here by JavaScript -->
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
